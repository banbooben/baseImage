# 钉钉数字同事（DWS + DSH + 钉钉插件）独立构建入口 —— 单独重建这一组镜像，
# 不必跑完整条 base → language → software → deployment 链。
# 对应 GitHub 侧 build-dingtalk-dsh-images.yml（workflow_dispatch）；
# GitHub 的 dsh_version 输入在这里用 DSH_VERSION 变量覆盖实现（手动触发 pipeline 时改值）。
# 仅手动；job 级 needs: [] 打断 stage 顺序

variables:
  DSH_VERSION: "0.1.2-rc.1"

dingtalk-dsh-backend:
  extends: .manual_only
  # 同时产出 Ubuntu(noble) 与 openEuler(openeuler-24.03) 两套标签。
  # OS_TAG 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签
  parallel:
    matrix:
      - OS_TAG:
          - noble
          - openeuler-24.03
  stage: software
  script:
    - echo "开始构建钉钉数字同事 backend 镜像"
    - cd $ROOT_PATH/${project_repo_name}
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/software:${OS_TAG}-dingtalk-dsh
      -f ./images/software/backend/dingtalk-dsh
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=${OS_TAG}
      --build-arg NPM_REGISTRY=https://registry.npmmirror.com
      --build-arg DSH_PIN_VERSION=${DSH_VERSION}
      --push
      .

desktop-python-312-ext-dingtalk-dsh:
  extends: .manual_only
  # 上游 base / software 层都已双发行版化，这里跟着出两套
  parallel:
    matrix:
      - OS_TAG:
          - noble
          - openeuler-24.03
  stage: deployment
  script:
    - echo "开始构建钉钉数字同事桌面镜像（Python 3.12 extension-pack）"
    - cd $ROOT_PATH/${project_repo_name}
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/deployment:${OS_TAG}-desktop-python3.12-extension-pack-dingtalk-dsh
      -f ./deployment/common/desktop/python-extension-pack/py-3.12-codeserver-sshd-chrome-dbeaver-wps-vscode-dingtalk-dsh
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=${OS_TAG}
      --build-arg NPM_REGISTRY=https://registry.npmmirror.com
      --build-arg DSH_PIN_VERSION=${DSH_VERSION}
      --push
      .

desktop-python-314-ext-dingtalk-dsh:
  extends: .manual_only
  # 上游 base / software 层都已双发行版化，这里跟着出两套
  parallel:
    matrix:
      - OS_TAG:
          - noble
          - openeuler-24.03
  stage: deployment
  script:
    - echo "开始构建钉钉数字同事桌面镜像（Python 3.14 extension-pack）"
    - cd $ROOT_PATH/${project_repo_name}
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/deployment:${OS_TAG}-desktop-python3.14-extension-pack-dingtalk-dsh
      -f ./deployment/common/desktop/python-extension-pack/py-3.14-codeserver-sshd-chrome-dbeaver-wps-vscode-dingtalk-dsh
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=${OS_TAG}
      --build-arg NPM_REGISTRY=https://registry.npmmirror.com
      --build-arg DSH_PIN_VERSION=${DSH_VERSION}
      --push
      .
