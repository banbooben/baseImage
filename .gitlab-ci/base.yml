  stage: base
  tags:
    - sync
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $BUILD_GROUP == "base"
      needs:
        - openeuler-2403
    - if: $CI_PIPELINE_SOURCE != "schedule"
      when: manual
  script:
    - echo "开始构建基础镜像 openEuler 24.03 LTS"
    - cd $ROOT_PATH/${project_repo_name}
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/base:openeuler-24.03
      -f ./images/base/Dockerfile
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=openeuler-24.03
      --build-arg BASE_OS_IMAGE=${REGISTRY}/${NAMESPACE}/openeuler:24.03-lts
      --cache-from type=registry,ref=${REGISTRY}/${NAMESPACE}/base:openeuler-24.03
      --cache-to type=inline
      --push
      .
    # 语言/中间件镜像 final 阶段的上游：仅运行时依赖（无编译工具链）
    - echo "开始构建运行时基础镜像 openEuler 24.03 LTS"
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/base:openeuler-24.03-runtime
      -f ./images/base/Dockerfile
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=openeuler-24.03
      --build-arg BASE_OS_IMAGE=${REGISTRY}/${NAMESPACE}/openeuler:24.03-lts
      --build-arg BASE_PROFILE=runtime
      --cache-from type=registry,ref=${REGISTRY}/${NAMESPACE}/base:openeuler-24.03-runtime
      --cache-to type=inline
      --push
      .

