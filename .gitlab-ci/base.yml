# 对应 .github/workflows/build-base-images.yml
# Schedule：镜像同步 → base → base-desktop（rules 非空 needs 覆盖）
# 手动：job 级 needs: []，不依赖其它作业/stage
#
# 两套发行版各两个 job（base / base-desktop）；base job 同时产出
# base:<OS_TAG>（full，含工具链）与 base:<OS_TAG>-runtime（语言/中间件最终层用）。
# 另有 Ubuntu 专属的 noble-desktop-gnome（ubuntu-desktop-minimal，与 Xfce 变体并存）。
# 这里不用 parallel:matrix：
# desktop 变体的 needs 要指向同发行版的 base，矩阵展开后 job 名带 [xxx] 后缀，
# needs 引用会很脆；四个 job 显式写出更清楚。

noble:
  stage: base
  tags:
    - sync
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $BUILD_GROUP == "base"
      needs:
        - ubuntu-noble
    - if: $CI_PIPELINE_SOURCE != "schedule"
      when: manual
  script:
    - echo "开始构建基础镜像 ubuntu 24.04"
    - cd $ROOT_PATH/${project_repo_name}
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/base:noble
      -f ./images/base/Dockerfile
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=noble
      --cache-from type=registry,ref=${REGISTRY}/${NAMESPACE}/base:noble
      --cache-to type=inline
      --push
      .
    # 语言/中间件镜像 final 阶段的上游：仅运行时依赖（无编译工具链）
    - echo "开始构建运行时基础镜像 ubuntu 24.04"
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/base:noble-runtime
      -f ./images/base/Dockerfile
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=noble
      --build-arg BASE_PROFILE=runtime
      --cache-from type=registry,ref=${REGISTRY}/${NAMESPACE}/base:noble-runtime
      --cache-to type=inline
      --push
      .

noble-desktop:
  stage: base
  tags:
    - sync
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $BUILD_GROUP == "base"
      needs:
        - noble
    - if: $CI_PIPELINE_SOURCE != "schedule"
      needs:
        - noble
      when: manual
  script:
    - echo "开始构建基础镜像 ubuntu 24.04 desktop"
    - cd $ROOT_PATH/${project_repo_name}
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/base:noble-desktop
      -f ./images/base/Dockerfile-desktop
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=noble
      --cache-from type=registry,ref=${REGISTRY}/${NAMESPACE}/base:noble-desktop
      --cache-to type=inline
      --push
      .

# GNOME 变体（ubuntu-desktop-minimal）：仅 Ubuntu，openEuler 无对应打包。
# 与 noble-desktop（Xfce）并存，不互相替代。
noble-desktop-gnome:
  stage: base
  tags:
    - sync
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $BUILD_GROUP == "base"
      needs:
        - noble
    - if: $CI_PIPELINE_SOURCE != "schedule"
      needs:
        - noble
      when: manual
  script:
    - echo "开始构建基础镜像 ubuntu 24.04 desktop-gnome"
    - cd $ROOT_PATH/${project_repo_name}
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/base:noble-desktop-gnome
      -f ./images/base/Dockerfile-desktop-gnome
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=noble
      --cache-from type=registry,ref=${REGISTRY}/${NAMESPACE}/base:noble-desktop-gnome
      --cache-to type=inline
      --push
      .

