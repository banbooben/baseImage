# 组合部署镜像（多软件层合并）
# 仅手动；job 级 needs: [] 打断 stage 顺序
#
# python-ext-pack 矩阵条目：FLAVOR=desktop|server（决定 Dockerfile 目录与 tag），
# PYTHON_SERIES=Python 系列（透传同名 build-arg）

python-ext-pack:
  extends: .manual_only
  # 上游 base / software 层都已双发行版化，这里跟着出两套。
  # OS_TAG 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签
  parallel:
    matrix:
      - OS_TAG:
          - noble
          - openeuler-24.03
        FLAVOR: desktop
        PYTHON_SERIES: "3.12"
      - OS_TAG:
          - noble
          - openeuler-24.03
        FLAVOR: desktop
        PYTHON_SERIES: "3.14"
      - OS_TAG:
          - noble
          - openeuler-24.03
        FLAVOR: server
        PYTHON_SERIES: "3.12"
      - OS_TAG:
          - noble
          - openeuler-24.03
        FLAVOR: server
        PYTHON_SERIES: "3.14"
  stage: deployment
  script:
    - echo "开始构建 ${FLAVOR} 开发环境镜像（Python ${PYTHON_SERIES} extension-pack）"
    - cd $ROOT_PATH/${project_repo_name}
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/deployment:${OS_TAG}-${FLAVOR}-python${PYTHON_SERIES}-extension-pack
      -f ./deployment/common/${FLAVOR}/python-extension-pack/Dockerfile
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=${OS_TAG}
      --build-arg PYTHON_SERIES=${PYTHON_SERIES}
      --cache-from type=registry,ref=${REGISTRY}/${NAMESPACE}/cache:deployment-${FLAVOR}-python${PYTHON_SERIES}-ext-${OS_TAG}
      --cache-to type=registry,ref=${REGISTRY}/${NAMESPACE}/cache:deployment-${FLAVOR}-python${PYTHON_SERIES}-ext-${OS_TAG},mode=max
      --push
      .

nginx-code:
  extends: .manual_only
  parallel:
    matrix:
      - OS_TAG:
          - noble
          - openeuler-24.03
  stage: deployment
  script:
    - echo "开始构建 OpenResty + code-server 组合镜像"
    - cd $ROOT_PATH/${project_repo_name}
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/deployment:${OS_TAG}-server-nginx-code
      -f ./deployment/common/server/nginx-code/openresty-nginx
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=${OS_TAG}
      --cache-from type=registry,ref=${REGISTRY}/${NAMESPACE}/cache:deployment-server-nginx-code-${OS_TAG}
      --cache-to type=registry,ref=${REGISTRY}/${NAMESPACE}/cache:deployment-server-nginx-code-${OS_TAG},mode=max
      --push
      .
