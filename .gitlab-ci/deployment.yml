# 组合部署镜像（多软件层合并）
# 仅手动；job 级 needs: [] 打断 stage 顺序

nginx-code:
  extends: .manual_only
  # 上游 base / software 层都已双发行版化，这里跟着出两套
  parallel:
    matrix:
      - OS_TAG:
          - noble
          - openeuler-24.03
  stage: deployment
  script:
    - echo "开始构建 OpenResty + code-server 组合镜像"
    - cd $ROOT_PATH/${project_repo_name}
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/deployment:${OS_TAG}-server-nginx-code
      -f ./deployment/common/server/nginx-code/openresty-nginx
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=${OS_TAG}
      --push
      .

