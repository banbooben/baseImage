chrome:
  extends: .manual_only
  # 同时产出 Ubuntu(noble) 与 openEuler(openeuler-24.03) 两套标签。
  # Ubuntu 侧是 PPA 的 chromium，openEuler 侧是 Google Chrome 官方 .rpm，
  # 两边都发布 amd64 + arm64，故两个变体都是双架构。
  parallel:
    matrix:
      - OS_TAG:
          - noble
          - openeuler-24.03
  stage: software
  script:
    - echo "开始构建 Chromium 镜像"
    - cd $ROOT_PATH/${project_repo_name}
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/software:${OS_TAG}-chrome
      -f ./images/software/desktop/chrome
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=${OS_TAG}
      --push
      .

