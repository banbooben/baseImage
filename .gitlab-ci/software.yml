# 仅手动；job 级 needs: [] 打断 stage 顺序
#
# 矩阵条目：FLAVOR=backend|desktop（Dockerfile 目录），NAME=镜像名
# （= Dockerfile 文件名 = tag 后缀）。dingtalk-dsh 不在此列（见 dingtalk.yml）

software:
  extends: .manual_only
  # 同时产出 Ubuntu(noble) 与 openEuler(openeuler-24.03) 两套标签。
  # OS_TAG 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签
  parallel:
    matrix:
      - OS_TAG: [noble, openeuler-24.03]
        FLAVOR: backend
        NAME: code-server
      - OS_TAG: [noble, openeuler-24.03]
        FLAVOR: backend
        NAME: docker
      - OS_TAG: [noble, openeuler-24.03]
        FLAVOR: backend
        NAME: claude
      - OS_TAG: [noble, openeuler-24.03]
        FLAVOR: backend
        NAME: openresty
      - OS_TAG: [noble, openeuler-24.03]
        FLAVOR: desktop
        NAME: chrome
      - OS_TAG: [noble, openeuler-24.03]
        FLAVOR: desktop
        NAME: clash-verge
      - OS_TAG: [noble, openeuler-24.03]
        FLAVOR: desktop
        NAME: dbeaver
      - OS_TAG: [noble, openeuler-24.03]
        FLAVOR: desktop
        NAME: wps
      - OS_TAG: [noble, openeuler-24.03]
        FLAVOR: desktop
        NAME: vscode
  stage: software
  script:
    - echo "开始构建 ${NAME} 镜像"
    - cd $ROOT_PATH/${project_repo_name}
    # 只有 code-server 的 Dockerfile 会 mount 这个 secret；
    # 对其余镜像它只是被忽略的定义，不会进入镜像内容
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/software:${OS_TAG}-${NAME}
      -f ./images/software/${FLAVOR}/${NAME}
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=${OS_TAG}
      --secret id=CODE_SERVER_PASSWORD,env=CODE_SERVER_PASSWORD
      --cache-from type=registry,ref=${REGISTRY}/${NAMESPACE}/cache:software-${NAME}-${OS_TAG}
      --cache-to type=registry,ref=${REGISTRY}/${NAMESPACE}/cache:software-${NAME}-${OS_TAG},mode=max
      --push
      .
