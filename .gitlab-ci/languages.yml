# 对应 .github/workflows/build-language-images.yml（build-python job）
#
# 语言层全量矩阵：Python 3.10~3.15（含 -ft free-threaded）+ OpenJDK 21/24/25。
# 与 GitHub 侧 build-language-images.yml 保持同一份版本清单（字段含义一致）：
# Python 走官方源码包（python.org tarball）构建 CPython，miniconda3 已移除。
# redis 中间件在 GitHub 侧构建（本地 runner 下载外网源码包不稳定）。
#
# 仅手动：job 级 needs: []，base 未跑也能直接构建（上游镜像从仓库拉）。
#
# python 矩阵条目：PYTHON_SERIES=版本系列，TAG_SUFFIX=tag 后缀（-ft 为 free-threaded，
# 对应 DISABLE_GIL=true），FALLBACK 为版本解析失败时的兜底，
# PRERELEASE=true 时正式版发布前走 ftp 目录解析预发布包

python:
  stage: languages-python
  extends: .manual_only
  # 只产出 Ubuntu(noble)；openEuler 镜像已停用（2026-11）
  # OS_TAG 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签
  parallel:
    matrix:
      - OS_TAG: [noble]
        PYTHON_SERIES: "3.15"
        TAG_SUFFIX: ""
        DISABLE_GIL: "false"
        FALLBACK: "3.15.0rc2"
        PRERELEASE: "true"
      - OS_TAG: [noble]
        PYTHON_SERIES: "3.15"
        TAG_SUFFIX: "-ft"
        DISABLE_GIL: "true"
        FALLBACK: "3.15.0rc2"
        PRERELEASE: "true"
      - OS_TAG: [noble]
        PYTHON_SERIES: "3.14"
        TAG_SUFFIX: ""
        DISABLE_GIL: "false"
        FALLBACK: "3.14.0"
        PRERELEASE: "false"
      - OS_TAG: [noble]
        PYTHON_SERIES: "3.14"
        TAG_SUFFIX: "-ft"
        DISABLE_GIL: "true"
        FALLBACK: "3.14.0"
        PRERELEASE: "false"
      - OS_TAG: [noble]
        PYTHON_SERIES: "3.13"
        TAG_SUFFIX: ""
        DISABLE_GIL: "false"
        FALLBACK: "3.13.0"
        PRERELEASE: "false"
      - OS_TAG: [noble]
        PYTHON_SERIES: "3.13"
        TAG_SUFFIX: "-ft"
        DISABLE_GIL: "true"
        FALLBACK: "3.13.0"
        PRERELEASE: "false"
      - OS_TAG: [noble]
        PYTHON_SERIES: "3.12"
        TAG_SUFFIX: ""
        DISABLE_GIL: "false"
        FALLBACK: "3.12.0"
        PRERELEASE: "false"
      - OS_TAG: [noble]
        PYTHON_SERIES: "3.11"
        TAG_SUFFIX: ""
        DISABLE_GIL: "false"
        FALLBACK: "3.11.0"
        PRERELEASE: "false"
      - OS_TAG: [noble]
        PYTHON_SERIES: "3.10"
        TAG_SUFFIX: ""
        DISABLE_GIL: "false"
        FALLBACK: "3.10.0"
        PRERELEASE: "false"
  script:
    - echo "开始构建python${PYTHON_SERIES}${TAG_SUFFIX}镜像"
    - cd $ROOT_PATH/${project_repo_name}
    - |
      ARGS=(python "${PYTHON_SERIES}" "${FALLBACK}")
      [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)
      export VERSION=$(ci/resolve_versions.sh "${ARGS[@]}")
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/language:${OS_TAG}-python-${PYTHON_SERIES}${TAG_SUFFIX}
      -f ./images/languages/python/Dockerfile
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=${OS_TAG}
      --build-arg PYTHON_SERIES=${PYTHON_SERIES}
      --build-arg PYTHON_DISABLE_GIL=${DISABLE_GIL}
      --build-arg PYTHON_PIN_VERSION=$VERSION
      --cache-from type=registry,ref=${REGISTRY}/${NAMESPACE}/language:${OS_TAG}-python-${PYTHON_SERIES}${TAG_SUFFIX}
      --cache-to type=inline
      --push
      $BUILD_PROXY_ARGS
      .

openjdk:
  stage: languages-python
  extends: .manual_only
  # 只产出 Ubuntu(noble)；openEuler 镜像已停用（2026-11）
  # OS_TAG 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签
  # java 矩阵条目：major=主版本号，fallback 为版本解析失败时的兜底
  parallel:
    matrix:
      - OS_TAG: [noble]
        JAVA_MAJOR: "21"
        JAVA_FALLBACK: "21.0.0"
      - OS_TAG: [noble]
        JAVA_MAJOR: "24"
        JAVA_FALLBACK: "24.0.0"
      - OS_TAG: [noble]
        JAVA_MAJOR: "25"
        JAVA_FALLBACK: "25.0.0"
  script:
    - echo "开始构建 openjdk${JAVA_MAJOR} 镜像"
    - cd $ROOT_PATH/${project_repo_name}
    - |
      export VERSION=$(ci/resolve_versions.sh java "${JAVA_MAJOR}" "${JAVA_FALLBACK}")
    - >
      docker buildx build
      --builder builder
      --platform linux/amd64,linux/arm64
      -t ${REGISTRY}/${NAMESPACE}/language:${OS_TAG}-openjdk-${JAVA_MAJOR}
      -f ./images/languages/java/Dockerfile
      --build-arg REGISTRY=${REGISTRY}
      --build-arg NAMESPACE=${NAMESPACE}
      --build-arg OS_TAG=${OS_TAG}
      --build-arg JDK_VERSION=${JAVA_MAJOR}
      --build-arg JAVA_PIN_VERSION=$VERSION
      --cache-from type=registry,ref=${REGISTRY}/${NAMESPACE}/language:${OS_TAG}-openjdk-${JAVA_MAJOR}
      --cache-to type=inline
      --push
      $BUILD_PROXY_ARGS
      .
