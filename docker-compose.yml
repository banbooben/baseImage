# 本地测试：deployment:noble-desktop-python3.14-extension-pack
#
# 启动：
#   sudo docker compose up -d
#   sudo docker compose logs -f
#   sudo docker compose down          # 加 -v 连数据卷一起删
#
# 访问：
#   noVNC 桌面    http://127.0.0.1:6080   VNC 密码见 VNC_PASSWORD
#   code-server   http://127.0.0.1:8080   密码见 CODE_SERVER_PASSWORD
#   SSH           ssh -p 2222 sam@127.0.0.1   密码见 SAM_PASSWORD
#   原生 VNC      vncviewer 127.0.0.1:5901
#
# 当前镜像（2026-11-25 16:09 构建，digest sha256:53c3cbd3…）的已知问题：
# 下面 1~6 都已在工作区修好（install_base.sh / install_desktop.sh /
# install_wps.sh / install_code_server.sh），提交并重建镜像后即消失；
# 当前容器里只有 5、6 打了临时补丁，1~4 仍是镜像里的老行为。
#   1) 原生 VNC 5901 连不上：tigervncserver 默认 -localhost=1，只监听容器回环，
#      端口映射到宿主机也没用（noVNC 的 websockify 在容器内转发，不受影响）。
#   2) 新建的 workspace 卷属主是 root，桌面里的 sam 写不进去。卷是空的时每次重建
#      容器 Docker 都会重新把镜像目录的属主刷回去，手工 chown 撑不过 recreate，
#      需要在镜像里加一个 cont-init（参考 10-fix-sam-home）。
#   3) code-server 以 root 运行（HOME=/root），它写进 workspace 的文件是 root 所有，
#      桌面里的 sam 改不了。
#   4) vnc/start.sh 直接读 $RESOLUTION，但 longrun 不继承容器环境，自定义分辨率不生效。
#   5) 桌面应用（chrome/dbeaver/vscode/apifox）打不开：镜像里 sam 建在 uid 1001
#      （ubuntu 基础层已占 1000），构建期 /deployment/software/*/data 全是 1001；
#      而 compose 默认 PUID=1000，运行期 05-puid-pgid 只 chown 了 home，应用以 1000
#      跑却写不了 1001 的 profile 目录。临时解法：chown -R 1000:1000 /deployment/software
#      （11GB，约 4 分钟）；根治应在 05-puid-pgid 里补 chown /deployment/software/*/data。
#   6) WPS 起不来：office6 自带 libstdc++.so.6.0.28 通过 LD_LIBRARY_PATH 盖住系统版，
#      noble 的 libicuuc.so.74 需要 GLIBCXX_3.4.30 → dlopen libwpsmain.so 失败。
#      临时解法：把 /deployment/software/wps/opt/office6/libstdc++.so.6 改名禁用。

name: desktop-extension-pack

services:
  desktop:
    image: ${IMAGE:-registry.cn-hangzhou.aliyuncs.com/sarmn/deployment:noble-desktop-python3.14-extension-pack}
    container_name: desktop-extension-pack
    hostname: dev-desktop
    restart: unless-stopped

    # GUI 应用（Chromium/WPS/VS Code/Apifox）共用内存盘
    shm_size: "2gb"

    ports:
      # 默认只监听本机；需要局域网访问时设 BIND_ADDR=0.0.0.0
      - "${BIND_ADDR:-127.0.0.1}:6080:6080"   # noVNC 网页桌面
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"   # code-server
      - "${BIND_ADDR:-127.0.0.1}:2222:22"     # SSH
      - "${BIND_ADDR:-127.0.0.1}:5901:5901"   # 原生 VNC 客户端

    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 与宿主机 uid/gid 对齐，挂 bind mount 时避免 sam 写不进去
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      RESOLUTION: "${RESOLUTION:-1920x1080}"

      # 桌面密码（TigerVNC 只取前 8 个字符）
      VNC_PASSWORD: "${VNC_PASSWORD:-Sam.5H8g}"
      # 设置后 sam 可密码登录 SSH，且 sudo 需要密码；留空则仅密钥登录 + 免密 sudo
      SAM_PASSWORD: "${SAM_PASSWORD:-Sam.5H8g}"
      # code-server 必需，不提供会拒绝启动
      PASSWORD: "${CODE_SERVER_PASSWORD:-Sam.5H8g}"

    volumes:
      # sam 的家目录：SSH 密钥、VNC 密码、各应用配置都在这里
      - sam-home:/deployment/accounts/sam
      # 代码工作区（code-server / VS Code 打开的就是它）
      - workspace:/deployment/workspace
      # 可选：持久化 code-server 已安装的扩展
      # - code-server-extensions:/deployment/software/code-server/extensions

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:6080/ >/dev/null &&
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  sam-home:
  workspace:
  # code-server-extensions:
