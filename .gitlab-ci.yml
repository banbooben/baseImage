include:
  - local: '.gitlab-ci/languages.yml'
  - local: '.gitlab-ci/deployment.yml'
  - local: '.gitlab-ci/dingtalk.yml'

stages:
  - languages-python
  - software
  - deployment

variables:
  DOCKER_BUILDKIT: 1  # 启用 BuildKit
  # 禁用 buildx 默认的 provenance/SBOM 证明（阿里云 ACR 不接受 application/vnd.oci.empty.v1+json）
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  GIT_STRATEGY: none
  project_repo_name: baseImage
  # 构建辅助镜像（binfmt / moby-buildkit）所在命名空间，与产物镜像的
  # NAMESPACE 无关：它们在 sarmn_public 下且匿名可拉，而这两步在 docker login 之前执行
  COMMON_NAMESPACE: "sarmn_public"
  # 需在 GitLab / GitHub 配置同名变量（建议 Masked / Protected）：
  #   REGISTRY, NAMESPACE
  #   ALY_ARC_USERNAME, ALY_ARC_PASSWORD
  GIT_CLONE_BASE: "ssh://git@git.sarmn.cn:30102/deployment"
  # 构建期出网代理。buildx 不会把客户端环境变量自动注入 RUN 步骤（实测按
  # --build-arg 传入才会出现在容器的 $HTTP_PROXY 里），所以每个 buildx build
  # 都要带上这个参数串；脚本里按空格展开，不要加引号。
  # 本机 runner 的 buildkit 实例以 network=host 运行，127.0.0.1 即宿主机
  # （mihomo 监听 *:7890）。镜像仓库拉取/推送由 buildkit 自己完成，不受影响。
  BUILD_PROXY_ARGS: "--build-arg HTTP_PROXY=http://127.0.0.1:7890 --build-arg HTTPS_PROXY=http://127.0.0.1:7890 --build-arg http_proxy=http://127.0.0.1:7890 --build-arg https_proxy=http://127.0.0.1:7890 --build-arg NO_PROXY=localhost,127.0.0.1 --build-arg no_proxy=localhost,127.0.0.1"

# ---------------------------------------------------------------------------
# GitLab 侧只保留「需要时手动构建」的镜像：
#   languages.yml    language:<os>-python-<series>[-ft]、language:<os>-openjdk-<major>
#   deployment.yml   deployment:<os>-{desktop,server}-python<series>-extension-pack
#   dingtalk.yml     software:resolute-dingtalk-hermes
#
# base / software / middleware 三层已不在 GitLab 建流水线，统一由 GitHub Actions
# 的 build-all.yml 定时产出（base → software → middleware）；语言层与 deployment
# 组合镜像在 GitHub 侧也是手动触发。
#
# 因此这里没有任何定时 Schedule：GitLab 只做手动构建，且都带 needs: []
# （不依赖其它 job/stage，上游镜像从仓库直接拉）。
# ---------------------------------------------------------------------------

# 仅手动、无 stage 依赖
.manual_only:
  tags:
    - sync
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
      when: manual

before_script:
  - echo "开始准备构建环境"
  # 注册 QEMU 模拟 ARM 架构（qemu 10.x）。
  #
  # 为什么必须用 tonistiigi/binfmt 而不是原来的 multiarch-qemu-user-static
  # （2023-01 构建，里面是 qemu 7.2.0）：
  #   - qemu 7.2 不认识 openat2（arm64 系统调用号 437）和 fchmodat2（452），
  #     Ubuntu 26.04 的 GNU tar 解包正好会走这两个调用；
  #   - 结果是 arm64 腿解 s6-overlay 时所有子目录/普通文件/软链全部报
  #     "Function not implemented"，只有顶层的 /init 能落地，旧版 install_base.sh
  #     会把它吞成 "/command 为空" 的半空镜像（job 12019 / 12047 / 12054 都是这个）；
  #   - noble / openEuler 的用户态不走这两个调用，所以只有 resolute 中招。
  #
  # 为什么不能无脑 --install all：binfmt_misc 是宿主机全局状态，条目已存在时
  # --install 只打印一句跳过、退出码 0，并不会把旧的 qemu 7.2 换成新的；而
  # --uninstall all 在这版镜像里把 "all" 当成架构名，输出
  # "uninstalling: all not found" 等于没拆——所以「先 uninstall all 再 install all」
  # 修不好卡在旧 qemu 的宿主机（实测踩过，job 12054 因此继续用 7.2 构建）。
  # 真正替换必须先 --uninstall arm64。
  #
  # 也不能每个 job 都拆一遍重装：拆掉的瞬间宿主机上任何 arm64 程序的新进程都会
  # exec 失败（已在运行的进程不受影响，binfmt 只作用于 execve）。所以先做一次
  # 行为探测——arm64 下用 tar 建/解一个带子目录的包，qemu 7.2 必失败、qemu 10 必成功——
  # 只有探测失败才拆掉 arm64 重装。探测约 0.7s，命中时纯 no-op。
  - |
    BINFMT_IMG="${REGISTRY}/${COMMON_NAMESPACE}/common:tonistiigi-binfmt-latest"
    PROBE_IMG="${REGISTRY}/${NAMESPACE}/ubuntu:resolute"
    probe_arm64() {
      docker run --rm --platform linux/arm64 --entrypoint sh "${PROBE_IMG}" \
        -c 'mkdir -p /t/a/b && echo x > /t/a/b/f && tar -cf /t.tar -C /t a && mkdir -p /x && tar -xf /t.tar -C /x && cat /x/a/b/f > /dev/null' \
        > /dev/null 2>&1
    }
    if probe_arm64; then
      echo "arm64 模拟器可用（qemu 支持 openat2/fchmodat2），保持现有注册"
    else
      echo "arm64 模拟器缺失或过旧，重新注册（只动 arm64，其他架构不受影响）"
      docker run --privileged --rm "${BINFMT_IMG}" --uninstall arm64
      docker run --privileged --rm "${BINFMT_IMG}" --install all
      if probe_arm64; then
        echo "binfmt 重注册后探测通过"
      else
        # 不中断：探测镜像本身拉不到也会走到这里，直接失败会波及所有 job。
        # 但 resolute 的 arm64 腿接下来几乎必然报 Function not implemented，先在这里点名。
        echo "警告：binfmt 重注册后 arm64 探测仍失败（也可能是 ${PROBE_IMG} 拉取失败），" >&2
        echo "      resolute 的 arm64 腿大概率会报 Function not implemented" >&2
      fi
    fi
  # 初始化Buildx构建器
  # buildkit 是独立容器，不继承 job 容器的代理变量；network=host 下 127.0.0.1 即宿主机
  # （mihomo 监听 *:7890）。ACR/前端源走直连，其余出网走代理。
  # NO_PROXY 用 '"..."' 整体加引号是必须的：--driver-opt 按 CSV 解析，裸逗号会被拆成
  # 多个 Opt（报 expecting k=v），且引号必须包住整个字段，不能只包值。
  - >
    docker buildx create
    --name builder
    --driver docker-container
    --driver-opt network=host
    --driver-opt image=${REGISTRY}/${COMMON_NAMESPACE}/common:moby-buildkit-latest
    --driver-opt env.HTTP_PROXY=http://127.0.0.1:7890
    --driver-opt env.HTTPS_PROXY=http://127.0.0.1:7890
    --driver-opt '"env.NO_PROXY=registry.cn-hangzhou.aliyuncs.com,docker.m.daocloud.io,quay.io,localhost,127.0.0.1"'
    --use
  - docker buildx inspect builder --bootstrap

  - echo "登录容器镜像仓库"
  # 凭证缺失时 --password="" 会让 CLI 去交互式询问，非 TTY 下报
  # "Cannot perform an interactive login from a non TTY device"，看不出根因，这里先显式校验
  - |
    if [ -z "${ALY_ARC_USERNAME}" ] || [ -z "${ALY_ARC_PASSWORD}" ]; then
      echo "ERROR: 未配置 ALY_ARC_USERNAME / ALY_ARC_PASSWORD（Settings → CI/CD → Variables）"
      exit 1
    fi
    echo "${ALY_ARC_PASSWORD}" | docker login --username "${ALY_ARC_USERNAME}" --password-stdin "${REGISTRY}"

  - echo "克隆项目代码库"
  - export ROOT_PATH=$(pwd)
  - echo 'root path:' $ROOT_PATH
  - git clone -b $CI_COMMIT_REF_NAME --depth=1 ${GIT_CLONE_BASE}/${project_repo_name}.git
  - cd $ROOT_PATH/${project_repo_name}
  - echo 'project repo path:' $(pwd)
