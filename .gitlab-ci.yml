include:
  - local: '.gitlab-ci/sync.yml'
  - local: '.gitlab-ci/base.yml'
  - local: '.gitlab-ci/languages.yml'
  - local: '.gitlab-ci/software.yml'
  - local: '.gitlab-ci/deployment.yml'
  - local: '.gitlab-ci/dingtalk.yml'

stages:
  - sync
  - base
  - languages-python
  - software
  - deployment

variables:
  DOCKER_BUILDKIT: 1  # 启用 BuildKit
  # 禁用 buildx 默认的 provenance/SBOM 证明（阿里云 ACR 不接受 application/vnd.oci.empty.v1+json）
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  GIT_STRATEGY: none
  project_repo_name: baseImage
  # 构建辅助镜像（qemu-user-static / moby-buildkit）所在命名空间，与产物镜像的
  # NAMESPACE 无关：它们在 sarmn_public 下且匿名可拉，而这两步在 docker login 之前执行
  COMMON_NAMESPACE: "sarmn_public"
  # 需在 GitLab / GitHub 配置同名变量（建议 Masked / Protected）：
  #   REGISTRY, NAMESPACE
  #   ALY_ARC_USERNAME, ALY_ARC_PASSWORD
  GIT_CLONE_BASE: "ssh://git@git.sarmn.cn:30102/deployment"
  # 构建期出网代理。buildx 不会把客户端环境变量自动注入 RUN 步骤（实测按
  # --build-arg 传入才会出现在容器的 $HTTP_PROXY 里），所以每个 buildx build
  # 都要带上这个参数串；脚本里按空格展开，不要加引号。
  # 本机 runner 的 buildkit 实例以 network=host 运行，127.0.0.1 即宿主机
  # （mihomo 监听 *:7890）。镜像仓库拉取/推送由 buildkit 自己完成，不受影响。
  BUILD_PROXY_ARGS: "--build-arg HTTP_PROXY=http://127.0.0.1:7890 --build-arg HTTPS_PROXY=http://127.0.0.1:7890 --build-arg http_proxy=http://127.0.0.1:7890 --build-arg https_proxy=http://127.0.0.1:7890 --build-arg NO_PROXY=localhost,127.0.0.1 --build-arg no_proxy=localhost,127.0.0.1"

# ---------------------------------------------------------------------------
# 定时分组（GitLab 无法按 job 设 cron，用多个 Schedule + BUILD_GROUP 变量）
#
# GitLab 侧只跑「最小业务闭环」子集（base → python 3.12/3.14），全量矩阵
# （其余 Python 系列 / miniconda3 / openjdk / redis / 独立 software）由
# GitHub Actions 承担，本地 runner 不再下载那些外网源码包与镜像。
#
# Build → Pipeline schedules：
#
#   1) base        Interval: 0 16 * * *   BUILD_GROUP=base
#   2) languages   Interval: 0 19 * * *   BUILD_GROUP=languages
#
# 注意：rules 里写 needs: [] 在多数 GitLab 版本会被静默忽略（仍按 stage 排队）。
# 因此「无依赖」必须写在 job 级 needs: []；定时依赖用「非空」rules:needs 覆盖。
# ---------------------------------------------------------------------------

# base：定时（base/languages）自动跑；手动靠 job 级 needs:[] 可单独点
.schedule_base:
  tags:
    - sync
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $BUILD_GROUP == "base"
    - if: $CI_PIPELINE_SOURCE != "schedule"
      when: manual

# languages：定时覆盖 needs 依赖 base；手动沿用 job 级 needs:[]
.schedule_languages:
  tags:
    - sync
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $BUILD_GROUP == "languages"
    - if: $CI_PIPELINE_SOURCE != "schedule"
      when: manual

# 仅手动、无 stage 依赖
.manual_only:
  tags:
    - sync
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
      when: manual

before_script:
  - echo "开始准备构建环境"
  # 注册QEMU模拟ARM架构
  - docker run --rm --privileged ${REGISTRY}/${COMMON_NAMESPACE}/common:multiarch-qemu-user-static-latest --reset -p yes
  # 初始化Buildx构建器
  # buildkit 是独立容器，不继承 job 容器的代理变量；network=host 下 127.0.0.1 即宿主机
  # （mihomo 监听 *:7890）。ACR/前端源走直连，其余出网走代理。
  # NO_PROXY 用 '"..."' 整体加引号是必须的：--driver-opt 按 CSV 解析，裸逗号会被拆成
  # 多个 Opt（报 expecting k=v），且引号必须包住整个字段，不能只包值。
  - >
    docker buildx create
    --name builder
    --driver docker-container
    --driver-opt network=host
    --driver-opt image=${REGISTRY}/${COMMON_NAMESPACE}/common:moby-buildkit-latest
    --driver-opt env.HTTP_PROXY=http://127.0.0.1:7890
    --driver-opt env.HTTPS_PROXY=http://127.0.0.1:7890
    --driver-opt '"env.NO_PROXY=registry.cn-hangzhou.aliyuncs.com,docker.m.daocloud.io,quay.io,localhost,127.0.0.1"'
    --use
  - docker buildx inspect builder --bootstrap

  - echo "登录容器镜像仓库"
  # 凭证缺失时 --password="" 会让 CLI 去交互式询问，非 TTY 下报
  # "Cannot perform an interactive login from a non TTY device"，看不出根因，这里先显式校验
  - |
    if [ -z "${ALY_ARC_USERNAME}" ] || [ -z "${ALY_ARC_PASSWORD}" ]; then
      echo "ERROR: 未配置 ALY_ARC_USERNAME / ALY_ARC_PASSWORD（Settings → CI/CD → Variables）"
      exit 1
    fi
    echo "${ALY_ARC_PASSWORD}" | docker login --username "${ALY_ARC_USERNAME}" --password-stdin "${REGISTRY}"

  - echo "克隆项目代码库"
  - export ROOT_PATH=$(pwd)
  - echo 'root path:' $ROOT_PATH
  - git clone -b $CI_COMMIT_REF_NAME --depth=1 ${GIT_CLONE_BASE}/${project_repo_name}.git
  - cd $ROOT_PATH/${project_repo_name}
  - echo 'project repo path:' $(pwd)
