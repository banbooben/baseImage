name: 构建软件镜像

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  build-code-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker_installer/dockerfiles/software/code-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:noble-code-server
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
          secrets: |
            CODE_SERVER_PASSWORD=${{ secrets.CODE_SERVER_PASSWORD }}

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker_installer/dockerfiles/software/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:noble-docker
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}

  build-dbeaver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker_installer/dockerfiles/software/dbeaver
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:noble-dbeaver
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}

  build-clash-verge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker_installer/dockerfiles/software/clash-verge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:noble-clash-verge
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
