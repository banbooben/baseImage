name: 构建 llama.cpp 镜像

# llama.cpp（llama-server / llama-cli 等）独立构建入口 —— 只重建这一个镜像，
# 不必跑完整条 base → language → software → deployment 链。
#
# 与分层 workflow 的关系：`software:<os>-llama-cpp` 仍保留在
# build-python-software-images.yml 的矩阵里（随每周全量链自动更新）；本文件只是
# 迭代安装脚本 / 临时出包时的快速入口，两条路径推送同一个 tag，互不冲突。
#
# 前置条件（本 workflow 不构建，须已推送）：
#   - FROM base:<os> —— 由 build-base-images.yml 产出
#
# 本镜像只含 CPU 后端（CUDA / HIP / Vulkan 等由后续独立镜像扩展）；x86_64 用
# GGML_CPU_ALL_VARIANTS 运行时按 CPU 特性分派，arm64 为单一基线静态构建。
# 详见 images/software/backend/install_llamacpp.sh。

on:
  workflow_dispatch:
    inputs:
      llamacpp_version:
        description: 'llama.cpp 版本（tag 或版本号，如 0.8.0 / v0.8.0；留空 = 最新 release）'
        required: false
        default: ''

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  build-llama-cpp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
          - openeuler-24.03
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          provenance: false
          sbom: false
          context: .
          file: ./images/software/backend/llama-cpp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:${{ matrix.os_tag }}-llama-cpp
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:${{ matrix.os_tag }}-llama-cpp
          cache-to: type=inline
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
            LLAMACPP_PIN_VERSION=${{ inputs.llamacpp_version }}
