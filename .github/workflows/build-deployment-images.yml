name: 构建全量开发环境镜像

on:
  # 不再进入 build-all 自动链：deployment 镜像需要时手动 dispatch 本文件。
  # 上游是 base / language(python) / software，得先有对应产物（语言层见
  # build-language-images.yml）。
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  # ── python-extension-pack（desktop / server × Python 3.14）────────────
  build-python-ext-pack:
    runs-on: ubuntu-latest
    # 只产出 Ubuntu(noble)；openEuler 镜像已停用（2026-11）
    # os_tag 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签。
    # target 矩阵条目：flavor=desktop|server（决定 Dockerfile 目录与 tag），
    # series=Python 系列（透传 PYTHON_SERIES build-arg）
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
        target:
          - { flavor: desktop, series: "3.14" }
          - { flavor: server, series: "3.14" }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          provenance: false
          sbom: false
          context: .
          file: ./deployment/common/${{ matrix.target.flavor }}/python-extension-pack/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deployment:${{ matrix.os_tag }}-${{ matrix.target.flavor }}-python${{ matrix.target.series }}-extension-pack
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deployment:${{ matrix.os_tag }}-${{ matrix.target.flavor }}-python${{ matrix.target.series }}-extension-pack
          cache-to: type=inline
          # 每次构建刷新 DBeaver 及驱动预取层（只重建这一层，chrome/WPS/VS Code/Apifox 仍走缓存）
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
            PYTHON_SERIES=${{ matrix.target.series }}
            DBEAVER_CACHE_BUST=${{ github.run_id }}

  # ── Server: OpenResty + code-server ───────────────────────────────────
  build-server-nginx-code:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          provenance: false
          sbom: false
          context: .
          file: ./deployment/common/server/nginx-code/openresty-nginx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deployment:${{ matrix.os_tag }}-server-nginx-code
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deployment:${{ matrix.os_tag }}-server-nginx-code
          cache-to: type=inline
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
