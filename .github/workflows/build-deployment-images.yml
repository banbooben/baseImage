name: 构建全量开发环境镜像

on:
  schedule:
    # 每周日 UTC 22:00（周一凌晨 06:00 北京时间），在所有依赖镜像构建之后
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  # ── Desktop: single Python 3.12 ───────────────────────────────────────
  build-desktop-python-312-ext:
    runs-on: ubuntu-latest
    # 每个 job 同时产出 Ubuntu(noble) 与 openEuler(openeuler-24.03) 两套标签。
    # os_tag 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
          - openeuler-24.03
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          provenance: false
          sbom: false
          context: .
          file: ./deployment/common/desktop/python-extension-pack/py-3.12-codeserver-sshd-chrome-dbeaver-wps-vscode
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deployment:${{ matrix.os_tag }}-desktop-python3.12-extension-pack
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}

  # ── Desktop: single Python 3.14 ───────────────────────────────────────
  build-desktop-python-314-ext:
