          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          provenance: false
          sbom: false
          context: .
          file: ./deployment/common/server/nginx-code/openresty-nginx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deployment:${{ matrix.os_tag }}-server-nginx-code
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}

  # ── Server: single Python 3.14 ────────────────────────────────────────
