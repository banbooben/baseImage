name: 构建中间件镜像

on:
  # 由 build-all.yml 经 workflow_call 编排，上游是 base（由 build-all.yml 的
  # needs: 保证 base 全部 job 成功后才调用本文件）。
  workflow_call:
  # 保留手动入口：单层重建直接 dispatch 本文件，不必跑整条链。
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  build-redis:
    runs-on: ubuntu-latest
    # 每个 job 同时产出 Ubuntu(noble) 与 openEuler(openeuler-24.03) 两套标签。
    # os_tag 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签。
    # redis 矩阵条目：series=版本系列，fallback 为版本解析失败时的兜底
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
          - openeuler-24.03
        redis:
          - { series: "7.4", fallback: "7.4.0" }
          - { series: "8.2", fallback: "8.2.0" }
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest Redis version
        id: version
        run: |
          VERSION=$(ci/resolve_versions.sh redis "${{ matrix.redis.series }}" "${{ matrix.redis.fallback }}")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          provenance: false
          sbom: false
          context: .
          file: ./images/middleware/redis/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/middleware:${{ matrix.os_tag }}-redis-${{ matrix.redis.series }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/cache:middleware-redis-${{ matrix.redis.series }}-${{ matrix.os_tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/cache:middleware-redis-${{ matrix.redis.series }}-${{ matrix.os_tag }},mode=max
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
            REDIS_SERIES=${{ matrix.redis.series }}
            REDIS_PIN_VERSION=${{ steps.version.outputs.version }}
          secrets: |
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
