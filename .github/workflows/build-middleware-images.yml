name: 构建中间件镜像

# 中间件类镜像（middleware:<os>-redis-*）独立入口。
# 由原 build-java-middleware-images.yml 拆分而来（语言层见 build-language-images.yml，
# 软件层见 build-software-images.yml）。
#
# 前置条件：base:<os> 已存在（build-base-images.yml 产出）。
# 产物：middleware:<os>-redis-<series>

on:
  workflow_call:
  # 保留手动入口：单层重建直接 dispatch 本文件，不必跑整条链。
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  build-redis:
    runs-on: ubuntu-latest
    # 只产出 Ubuntu(noble)；openEuler 镜像已停用（2026-11）
    # os_tag 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签。
    # redis 矩阵条目：series=版本系列，fallback 为版本解析失败时的兜底
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
        redis:
          - { series: "7.4", fallback: "7.4.0" }
          - { series: "8.2", fallback: "8.2.0" }
    steps:
      - uses: actions/checkout@v7
      - name: Resolve latest Redis version
        id: version
        run: |
          VERSION=$(ci/resolve_versions.sh redis "${{ matrix.redis.series }}" "${{ matrix.redis.fallback }}")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          provenance: false
          sbom: false
          context: .
          file: ./images/middleware/redis/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/middleware:${{ matrix.os_tag }}-redis-${{ matrix.redis.series }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/middleware:${{ matrix.os_tag }}-redis-${{ matrix.redis.series }}
          cache-to: type=inline
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
            REDIS_SERIES=${{ matrix.redis.series }}
            REDIS_PIN_VERSION=${{ steps.version.outputs.version }}
