name: 定时构建中间件镜像

on:
  schedule:
    # 每周一 UTC 20:00（周二凌晨 04:00 北京时间），在 base 镜像构建之后
    - cron: '0 20 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  build-redis-7-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest Redis version
        id: version
        run: |
          VERSION=$(curl -fsSL "https://endoflife.date/api/redis/7.4.json" 2>/dev/null \
            | sed -n 's/.*"latest"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          if [ -z "$VERSION" ]; then
            echo "Failed to resolve version, using fallback" >&2
            VERSION="7.4.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved Redis version: $VERSION"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker_installer/dockerfiles/middleware/redis/Dockerfile.7.4
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/middleware:noble-redis-7.4
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            REDIS_PIN_VERSION=${{ steps.version.outputs.version }}
          secrets: |
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

  build-redis-8-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest Redis version
        id: version
        run: |
          VERSION=$(curl -fsSL "https://endoflife.date/api/redis/8.2.json" 2>/dev/null \
            | sed -n 's/.*"latest"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          if [ -z "$VERSION" ]; then
            echo "Failed to resolve version, using fallback" >&2
            VERSION="8.2.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved Redis version: $VERSION"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker_installer/dockerfiles/middleware/redis/Dockerfile.8.2
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/middleware:noble-redis-8.2
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            REDIS_PIN_VERSION=${{ steps.version.outputs.version }}
          secrets: |
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
