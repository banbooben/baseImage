name: 构建 Python 与软件镜像

# 由 build-all.yml 经 workflow_call 编排，上游是 base（由 build-all.yml 的
# needs: 保证 base 全部 job 成功后才调用本文件）。
# deployment 层 gate 在本 workflow 上——python / miniconda3 / software 三个 job
# 全部成功，deployment 才会被触发（与被合并前的 python + software 双文件语义相同）。

on:
  workflow_call:
  # 保留手动入口：单层重建直接 dispatch 本文件，不必跑整条链。
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  build-python:
    runs-on: ubuntu-latest
    # 每个 job 同时产出 Ubuntu(noble) 与 openEuler(openeuler-24.03) 两套标签。
    # os_tag 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签。
    # python 矩阵条目：series=版本系列, suffix=tag 后缀（-ft 为 free-threaded），
    # disable_gil 透传 --disable-gil，fallback 为版本解析失败时的兜底，
    # prerelease=true 时正式版发布前走 ftp 目录解析预发布包
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
          - openeuler-24.03
        python:
          - { series: "3.15", suffix: "", fallback: "3.15.0rc2", prerelease: true }
          - { series: "3.15", suffix: "-ft", disable_gil: true, fallback: "3.15.0rc2", prerelease: true }
          - { series: "3.14", suffix: "", fallback: "3.14.0" }
          - { series: "3.14", suffix: "-ft", disable_gil: true, fallback: "3.14.0" }
          - { series: "3.13", suffix: "", fallback: "3.13.0" }
          - { series: "3.13", suffix: "-ft", disable_gil: true, fallback: "3.13.0" }
          - { series: "3.12", suffix: "", fallback: "3.12.0" }
          - { series: "3.11", suffix: "", fallback: "3.11.0" }
          - { series: "3.10", suffix: "", fallback: "3.10.0" }
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest Python version
        id: version
        run: |
          ARGS=(python "${{ matrix.python.series }}" "${{ matrix.python.fallback }}")
          [ "${{ matrix.python.prerelease || false }}" = "true" ] && ARGS+=(--prerelease)
          VERSION=$(ci/resolve_versions.sh "${ARGS[@]}")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          provenance: false
          sbom: false
          context: .
          file: ./images/languages/python/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/language:${{ matrix.os_tag }}-python-${{ matrix.python.series }}${{ matrix.python.suffix }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/language:${{ matrix.os_tag }}-python-${{ matrix.python.series }}${{ matrix.python.suffix }}
          cache-to: type=inline
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
            PYTHON_SERIES=${{ matrix.python.series }}
            PYTHON_DISABLE_GIL=${{ matrix.python.disable_gil || false }}
            PYTHON_PIN_VERSION=${{ steps.version.outputs.version }}

  build-miniconda3:
    runs-on: ubuntu-latest
    # 每个 job 同时产出 Ubuntu(noble) 与 openEuler(openeuler-24.03) 两套标签。
    # os_tag 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
          - openeuler-24.03
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          provenance: false
          sbom: false
          context: .
          file: ./images/languages/python/miniconda3
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/language:${{ matrix.os_tag }}-miniconda-3
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/language:${{ matrix.os_tag }}-miniconda-3
          cache-to: type=inline
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}

  build-software:
    runs-on: ubuntu-latest
    # 每个 job 同时产出 Ubuntu(noble) 与 openEuler(openeuler-24.03) 两套标签。
    # os_tag 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签。
    # target 矩阵条目：flavor=backend|desktop（Dockerfile 目录），name=镜像名
    # （= Dockerfile 文件名 = tag 后缀）。dingtalk-dsh 不在此列（独立 workflow）
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
          - openeuler-24.03
        target:
          - { flavor: backend, name: code-server }
          - { flavor: backend, name: docker }
          - { flavor: backend, name: claude }
          - { flavor: backend, name: openresty }
          - { flavor: desktop, name: chrome }
          - { flavor: desktop, name: clash-verge }
          - { flavor: desktop, name: dbeaver }
          - { flavor: desktop, name: wps }
          - { flavor: desktop, name: vscode }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          provenance: false
          sbom: false
          context: .
          file: ./images/software/${{ matrix.target.flavor }}/${{ matrix.target.name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:${{ matrix.os_tag }}-${{ matrix.target.name }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:${{ matrix.os_tag }}-${{ matrix.target.name }}
          cache-to: type=inline
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
          # 只有 code-server 的 Dockerfile 会 mount 这个 secret；
          # 对其余镜像它只是被忽略的定义，不会进入镜像内容
          secrets: |
            CODE_SERVER_PASSWORD=${{ secrets.CODE_SERVER_PASSWORD }}
