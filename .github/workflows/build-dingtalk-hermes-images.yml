name: 构建钉钉数字同事镜像

# 钉钉数字同事（DWS + Hermes + dingtalk-bridge 群桥）独立构建入口 —— 单独重建
# 这个镜像，不必跑完整条 base → language → software → deployment 链。
#
# 与分层 workflow 的关系：dingtalk-hermes 镜像不在分层链里 ——
# `software:<os>-dingtalk-hermes` 不在 build-software-images.yml，只在这里构建。
# 单独放这里，是为了迭代安装脚本（install_dingtalk_hermes.sh）时能一键只重建钉钉
# 镜像，且不并入自动的 base → software → deployment 链。
#
# 只产出 server 版；运行期由 s6 常驻两个服务：dingtalk-hermes（hermes gateway，
# 承载钉钉原生平台私聊）与 dingtalk-bridge（群聊监控桥）。
# desktop 变体（deployment:<os>-desktop-...-extension-pack-dingtalk-hermes）已移除，
# 需要时从 git 历史恢复。
#
# 历史：dsh 方案（software:<os>-dingtalk-dsh，Node 24 + DSH + 钉钉插件）已于
# 2026-11 移除 —— DSH 与插件版本迭代过快、镜像很快失效。后续 DSH 稳定再评估；
# 源码/脚本/CI 可从 git 历史（6702243 及之前）恢复。
#
# 前置条件（先已推送的产物，本 workflow 不再构建）：
#   - FROM base:resolute —— 由 build-base-images.yml 产出（Ubuntu 26.04）

on:
  workflow_dispatch:
    inputs:
      hermes_version:
        description: 'Hermes 版本（NousResearch/hermes-agent 的 pin tag）'
        required: false
        default: 'v0.22.4'
      dws_version:
        description: 'DWS 版本（dingtalk-workspace-cli；留空 = latest）'
        required: false
        default: ''

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  # ── software:<os>-dingtalk-hermes（server 版）────────────────────────
  build-dingtalk-hermes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - resolute
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          provenance: false
          sbom: false
          context: .
          file: ./images/software/backend/dingtalk-hermes
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:${{ matrix.os_tag }}-dingtalk-hermes
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:${{ matrix.os_tag }}-dingtalk-hermes
          cache-to: type=inline
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
            HERMES_PIN_VERSION=${{ inputs.hermes_version }}
            DWS_PIN_VERSION=${{ inputs.dws_version }}

