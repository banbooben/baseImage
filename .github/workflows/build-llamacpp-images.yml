name: 定时构建 llama.cpp 镜像

on:
  schedule:
    # 每周日 UTC 22:30（周一凌晨 06:30 北京时间），在 base 镜像构建之后
    - cron: '30 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  # llama.cpp CUDA（GPU 推理，CUDA 编译仅支持 amd64）
  build-llamacpp-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          provenance: false
          sbom: false
          context: .
          file: ./deployment/noble/server/llamacpp/llamacpp-cuda
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deployment:noble-server-llamacpp-cuda
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}

  # llama.cpp 开发镜像（llamacpp-cuda + Python 3.12 + code-server + sshd）
  # 依赖上面的 llamacpp-cuda 先推送
  build-llamacpp-cuda-dev:
    needs: build-llamacpp-cuda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          provenance: false
          sbom: false
          context: .
          file: ./deployment/noble/server/llamacpp/llamacpp-cuda-py3.12-codeserver
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deployment:noble-server-llamacpp-cuda-py3.12-codeserver
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
