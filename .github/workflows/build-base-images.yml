name: 构建基础镜像

on:
  # 由 build-all.yml 经 workflow_call 编排。被调用的 workflow 只有内部所有 job
  # 都成功才算成功，下游层的 needs: 据此被触发——这就是"节点状态"的传播方式，
  # 不需要额外写状态检查。定时入口统一收敛到 build-all.yml，本文件不再挂 schedule。
  workflow_call:
  # 保留手动入口：单层重建直接 dispatch 本文件，不必跑整条链。
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  # 1. 同步官方基础镜像（Ubuntu / openEuler）
  #    openEuler 官方镜像在 Docker Hub 与 quay.io 都有，用 quay.io——
  #    Docker Hub 在部分网络（含构建机）不可达。24.03-lts 是原地更新的滚动 tag。
  sync-base-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-noble
            target: ubuntu:noble
            source: docker.io/library/ubuntu:noble
          # desktop-rdp 变体（GNOME 50 + headless RDP）只支持 resolute
          - name: ubuntu-resolute
            target: ubuntu:resolute
            source: docker.io/library/ubuntu:resolute
          - name: openeuler-2403
            target: openeuler:24.03-lts
            source: quay.io/openeuler/openeuler:24.03-lts
    steps:
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录容器镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - name: 同步 ${{ matrix.target }}
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.target }} \
            ${{ matrix.source }}

      - name: 验证同步结果
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.target }}

  # 2. 构建 base:<OS_TAG>
  build-base:
    needs: sync-base-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只放 <repo>:<tag> 后缀——strategy.matrix 求值时 env 上下文不可用
          - os_tag: noble
            base_os_image: ubuntu:noble
          # resolute：Ubuntu 26.04，供 desktop-rdp 变体（GNOME 50 + RDP）使用
          - os_tag: resolute
            base_os_image: ubuntu:resolute
          - os_tag: openeuler-24.03
            base_os_image: openeuler:24.03-lts
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录容器镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - name: 构建 base:${{ matrix.os_tag }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/base:${{ matrix.os_tag }} \
            -f ./images/base/Dockerfile \
            --build-arg REGISTRY=${{ env.REGISTRY }} \
            --build-arg NAMESPACE=${{ env.NAMESPACE }} \
            --build-arg OS_TAG=${{ matrix.os_tag }} \
            --build-arg BASE_OS_IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.base_os_image }} \
            --cache-from type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/base:${{ matrix.os_tag }} \
            --cache-to type=inline \
            --provenance=false \
            --sbom=false \
            --push \
            .

      # 语言/中间件镜像的 final 阶段 FROM 这一层：只有运行时依赖，不含编译工具链
      - name: 构建 base:${{ matrix.os_tag }}-runtime
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/base:${{ matrix.os_tag }}-runtime \
            -f ./images/base/Dockerfile \
            --build-arg REGISTRY=${{ env.REGISTRY }} \
            --build-arg NAMESPACE=${{ env.NAMESPACE }} \
            --build-arg OS_TAG=${{ matrix.os_tag }} \
            --build-arg BASE_OS_IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.base_os_image }} \
            --build-arg BASE_PROFILE=runtime \
            --cache-from type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/base:${{ matrix.os_tag }}-runtime \
            --cache-to type=inline \
            --provenance=false \
            --sbom=false \
            --push \
            .

  # 3. 构建 base:<OS_TAG>-desktop
  build-base-desktop:
    needs: build-base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os_tag: [noble, openeuler-24.03]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录容器镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - name: 构建 base:${{ matrix.os_tag }}-desktop
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/base:${{ matrix.os_tag }}-desktop \
            -f ./images/base/Dockerfile-desktop \
            --build-arg REGISTRY=${{ env.REGISTRY }} \
            --build-arg NAMESPACE=${{ env.NAMESPACE }} \
            --build-arg OS_TAG=${{ matrix.os_tag }} \
            --cache-from type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/base:${{ matrix.os_tag }}-desktop \
            --cache-to type=inline \
            --provenance=false \
            --sbom=false \
            --push \
            .

  # 4. 构建 base:<OS_TAG>-desktop-gnome（Ubuntu 专用）
  #    ubuntu-desktop-minimal 是 Ubuntu 专有的 GNOME 打包，openEuler 没有对应物。
  #    与 -desktop 变体并存：-desktop 仍是默认的 Xfce 方案。
  build-base-desktop-gnome:
    needs: build-base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os_tag: [noble]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录容器镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - name: 构建 base:${{ matrix.os_tag }}-desktop-gnome
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/base:${{ matrix.os_tag }}-desktop-gnome \
            -f ./images/base/Dockerfile-desktop-gnome \
            --build-arg REGISTRY=${{ env.REGISTRY }} \
            --build-arg NAMESPACE=${{ env.NAMESPACE }} \
            --build-arg OS_TAG=${{ matrix.os_tag }} \
            --cache-from type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/base:${{ matrix.os_tag }}-desktop-gnome \
            --cache-to type=inline \
            --provenance=false \
            --sbom=false \
            --push \
            .

  # 5. 构建 base:<OS_TAG>-desktop-rdp（仅 resolute）
  #    GNOME 50（Ubuntu 26.04）只有 Wayland 会话，远程桌面改用 gnome-remote-desktop
  #    的 headless RDP（端口 3389），不再是 TigerVNC + noVNC。
  #    noble 上没有 GNOME 50，对应方案仍是 -desktop-gnome（VNC）。
  build-base-desktop-rdp:
    needs: build-base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os_tag: [resolute]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录容器镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - name: 构建 base:${{ matrix.os_tag }}-desktop-rdp
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/base:${{ matrix.os_tag }}-desktop-rdp \
            -f ./images/base/Dockerfile-desktop-rdp \
            --build-arg REGISTRY=${{ env.REGISTRY }} \
            --build-arg NAMESPACE=${{ env.NAMESPACE }} \
            --build-arg OS_TAG=${{ matrix.os_tag }} \
            --cache-from type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/base:${{ matrix.os_tag }}-desktop-rdp \
            --cache-to type=inline \
            --provenance=false \
            --sbom=false \
            --push \
            .
