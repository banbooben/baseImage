name: 定时构建基础镜像

on:
  schedule:
    # 每周日 UTC 18:00（周一凌晨 02:00 北京时间）
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  # 1. 同步官方基础镜像（Ubuntu / openEuler）
  #    openEuler 官方镜像在 Docker Hub 与 quay.io 都有，用 quay.io——
  #    Docker Hub 在部分网络（含构建机）不可达。24.03-lts 是原地更新的滚动 tag。
  sync-base-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-noble
            target: ubuntu:noble
            source: docker.io/library/ubuntu:noble
          - name: openeuler-2403
            target: openeuler:24.03-lts
            source: quay.io/openeuler/openeuler:24.03-lts
    steps:
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - name: 同步 ${{ matrix.target }}
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.target }} \
            ${{ matrix.source }}

      - name: 验证同步结果
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.target }}

  # 2. 构建 base:<OS_TAG>
  build-base:
    needs: sync-base-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只放 <repo>:<tag> 后缀——strategy.matrix 求值时 env 上下文不可用
          - os_tag: noble
            base_os_image: ubuntu:noble
          - os_tag: openeuler-24.03
            base_os_image: openeuler:24.03-lts
    env:
      ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
      SARMN_PASSWORD: ${{ secrets.SARMN_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - name: 构建 base:${{ matrix.os_tag }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/base:${{ matrix.os_tag }} \
            -f ./docker_installer/dockerfiles/base/Dockerfile \
            --build-arg REGISTRY=${{ env.REGISTRY }} \
            --build-arg NAMESPACE=${{ env.NAMESPACE }} \
            --build-arg OS_TAG=${{ matrix.os_tag }} \
            --build-arg BASE_OS_IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.base_os_image }} \
            --secret id=ROOT_PASSWORD,env=ROOT_PASSWORD \
            --secret id=SARMN_PASSWORD,env=SARMN_PASSWORD \
            --provenance=false \
            --sbom=false \
            --push \
            .

  # 3. 构建 base:<OS_TAG>-desktop
  build-base-desktop:
    needs: build-base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os_tag: [noble, openeuler-24.03]
    env:
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}

      - name: 构建 base:${{ matrix.os_tag }}-desktop
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/base:${{ matrix.os_tag }}-desktop \
            -f ./docker_installer/dockerfiles/base/Dockerfile-desktop \
            --build-arg REGISTRY=${{ env.REGISTRY }} \
            --build-arg NAMESPACE=${{ env.NAMESPACE }} \
            --build-arg OS_TAG=${{ matrix.os_tag }} \
            --secret id=VNC_PASSWORD,env=VNC_PASSWORD \
            --provenance=false \
            --sbom=false \
            --push \
            .
