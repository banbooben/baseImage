name: 构建 Java 镜像

on:
  # 由 build-all.yml 经 workflow_call 编排，上游是 base（由 build-all.yml 的
  # needs: 保证 base 全部 job 成功后才调用本文件）。
  workflow_call:
  # 保留手动入口：单层重建直接 dispatch 本文件，不必跑整条链。
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  build-openjdk:
    runs-on: ubuntu-latest
    # 每个 job 同时产出 Ubuntu(noble) 与 openEuler(openeuler-24.03) 两套标签。
    # os_tag 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签。
    # java 矩阵条目：major=主版本号，fallback 为版本解析失败时的兜底
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
          - openeuler-24.03
        java:
          - { major: "21", fallback: "21.0.0" }
          - { major: "24", fallback: "24.0.0" }
          - { major: "25", fallback: "25.0.0" }
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest OpenJDK version
        id: version
        run: |
          MAJOR="${{ matrix.java.major }}"
          NEXT=$((MAJOR + 1))
          VERSION=$(curl -fsSL "https://api.adoptium.net/v3/info/release_versions?version=%5B${MAJOR}%2C${NEXT}%29&release_type=ga&page_size=1&sort_method=DATE&sort_order=DESC" 2>/dev/null \
            | sed -n 's/.*"openjdk_version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          VERSION="${VERSION%-LTS}"
          if [ -z "$VERSION" ]; then
            echo "Failed to resolve version, using fallback" >&2
            VERSION="${{ matrix.java.fallback }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved OpenJDK version: $VERSION"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          provenance: false
          sbom: false
          context: .
          file: ./images/languages/java/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/language:${{ matrix.os_tag }}-openjdk-${{ matrix.java.major }}
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
            JDK_VERSION=${{ matrix.java.major }}
            JAVA_PIN_VERSION=${{ steps.version.outputs.version }}
