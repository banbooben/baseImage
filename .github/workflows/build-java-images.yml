name: 定时构建 Java 镜像

on:
  schedule:
    # 每周日 UTC 20:00（周一凌晨 04:00 北京时间），在 base 镜像构建之后
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  build-openjdk21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest OpenJDK version
        id: version
        run: |
          VERSION=$(curl -fsSL "https://api.adoptium.net/v3/info/release_versions?version=%5B21%2C22%29&release_type=ga&page_size=1&sort_method=DATE&sort_order=DESC" 2>/dev/null \
            | sed -n 's/.*"openjdk_version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          VERSION="${VERSION%-LTS}"
          if [ -z "$VERSION" ]; then
            echo "Failed to resolve version, using fallback" >&2
            VERSION="21.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved OpenJDK version: $VERSION"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker_installer/dockerfiles/languages/java/openjdk-21
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/language:noble-openjdk-21
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            JAVA_PIN_VERSION=${{ steps.version.outputs.version }}

  build-openjdk24:
