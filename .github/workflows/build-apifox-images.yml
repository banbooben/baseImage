name: 构建 Apifox 镜像

# Apifox 桌面镜像（software:<os>-apifox）的独立构建入口。
#
# 为什么单独成文件：Apifox 的安装包不在发行版软件源里，构建期需要从官方
# 渠道下载 AppImage zip（只有 -latest，约 200MB）再解包，下载源在不同网络下
# 行为不一致（官方站点可能返回下载验证页）。把它从 build-python-software-images.yml
# 的矩阵里拆出来，迭代安装脚本 / 临时出包时不必跟着跑整批 software 镜像。
#
# 与分层 workflow 的关系：本镜像不被 deployment 链消费
# （extension-pack 是直接在自身上跑 install_apifox.sh），所以不进入
# build-all.yml 的每周链；需要更新时手动 dispatch 本文件。
#
# 前置条件（本 workflow 不构建，须已推送）：
#   - FROM base:<os>-desktop —— 由 build-base-images.yml 产出
#
# 下载源默认走阿里云 OSS CDN（国内可直连），安装脚本会校验 zip 魔数，
# 内容不是 zip（如官方站点的下载验证页）时自动回退到官方站点。
# 官方没有版本化 URL；需要固定版本时把 zip 自建到可访问的地址，用输入覆盖。

on:
  workflow_dispatch:
    inputs:
      apifox_download_url:
        description: 'Apifox zip 下载地址（留空 = 阿里云 OSS CDN 的 -latest）'
        required: false
        default: ''
      apifox_download_url_fallback:
        description: '回退下载地址（留空 = 官方站点）'
        required: false
        default: ''

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

# 同一时间只跑一条 Apifox 构建，避免并发推同一个 tag。
concurrency:
  group: build-apifox
  cancel-in-progress: false

jobs:
  build-apifox:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
          - openeuler-24.03
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      # 下载源是国内 CDN，runner 在海外；先打印响应头，构建失败时便于区分
      # 「网络不可达 / 返回验证页」和「解包失败」。不阻断构建。
      - name: 检查 Apifox 下载源
        run: |
          for url in \
            "https://file-assets-cdn.oss-cn-hangzhou.aliyuncs.com/download/Apifox-linux-latest.zip" \
            "https://file-assets.apifox.com/download/Apifox-linux-latest.zip"; do
            echo "== ${url}"
            curl -sIL --max-time 60 "${url}" | sed -n '1,10p' || echo "curl failed"
          done
      - uses: docker/build-push-action@v5
        with:
          provenance: false
          sbom: false
          context: .
          file: ./images/software/desktop/apifox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:${{ matrix.os_tag }}-apifox
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:${{ matrix.os_tag }}-apifox
          cache-to: type=inline
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
            APIFOX_DOWNLOAD_URL=${{ inputs.apifox_download_url }}
            APIFOX_DOWNLOAD_URL_FALLBACK=${{ inputs.apifox_download_url_fallback }}
