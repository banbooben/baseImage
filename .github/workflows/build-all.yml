name: 定时构建全部镜像

# 自动链只产出 base / software / middleware 三层；其余镜像（Python 语言层、
# deployment 组合镜像、钉钉、apifox、llama-cpp 等）一律手动触发，不进本链。
#
# 层序由 needs: 表达（状态依赖），不靠 cron 时间错峰——错峰一旦某层变慢，
# 下游会静默拉到来期版本的同名 tag，产出跨周混合镜像。
#
# 层次：
#   base ─┬─ software
#         └─ middleware
#
# 语言层（language:<os>-python-* / -openjdk-*）不在本链：手动触发
# build-language-images.yml。deployment 组合镜像同样不在本链，按需手动构建。
#
# 分层入口：
#   build-language-images.yml    语言层（python / openjdk）
#   build-software-images.yml    软件层（code-server / chrome / …）
#   build-middleware-images.yml  中间件层（redis）

on:
  schedule:
    # 每周日 UTC 18:00（北京时间周一 02:00）触发整条链。
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# 手动重跑时不与正在跑的链并发推同一批 tag。
# cancel-in-progress: false —— 不取消进行中的构建（一条链可能已跑很久），排队等它结束。
concurrency:
  group: build-all
  cancel-in-progress: false

jobs:
  # ── 第 1 层 ───────────────────────────────────────────────────────────
  # 同步上游官方镜像 → base:<os> → base:<os>-desktop
  base:
    uses: ./.github/workflows/build-base-images.yml
    secrets: inherit

  # ── 第 2 层：两者并行，都只依赖 base ─────────────────────────────────
  # software：code-server / openresty / chrome 等
  software:
    needs: base
    uses: ./.github/workflows/build-software-images.yml
    secrets: inherit

  # middleware：redis
  middleware:
    needs: base
    uses: ./.github/workflows/build-middleware-images.yml
    secrets: inherit
