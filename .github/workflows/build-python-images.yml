name: 定时构建 Python 镜像

on:
  schedule:
    # 每天 UTC 时间 16:00 执行（北京时间早上 2:00），在 base 镜像构建之后
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  build-python3-14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest Python version
        id: version
        run: |
          VERSION=$(curl -fsSL "https://endoflife.date/api/python/3.14.json" 2>/dev/null \
            | sed -n 's/.*"latest"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          if [ -z "$VERSION" ]; then
            echo "Failed to resolve version, using fallback" >&2
            VERSION="3.14.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved Python version: $VERSION"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker_installer/dockerfiles/languages/python/python3.14
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/language:noble-python-3.14
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            PYTHON_PIN_VERSION=${{ steps.version.outputs.version }}

