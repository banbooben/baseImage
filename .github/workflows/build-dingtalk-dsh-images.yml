name: 构建钉钉数字同事镜像

# 钉钉数字同事（DWS + DSH + 钉钉插件）独立构建入口 —— 单独重建这一组镜像，
# 不必跑完整条 base → language → software → deployment 链。
#
# 与分层 workflow 的关系：三个镜像已全部从分层链移除 —— backend 的
# `software:<os>-dingtalk-dsh` 从 build-python-software-images.yml 移除，desktop 两个
# `build-desktop-python-3.1x-ext-dingtalk-dsh` 从 build-deployment-images.yml
# 移除，现在都只在这里构建。单独放这里，是为了迭代安装脚本
# （install_dingtalk_dsh.sh）时能一键只重建 dingtalk-dsh 相关镜像，且不并入
# 自动的 base → software → deployment 链。
#
# 前置条件（先已推送的产物，本 workflow 不再构建）：
#   - backend 版 FROM base:<os>            —— 由 build-base-images.yml 产出
#   - desktop 版 FROM deployment:<os>-desktop-python3.12/3.14-extension-pack
#                                          —— 由 build-deployment-images.yml 产出

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'DSH 版本（@deepseek-ai/dsh 的 pin 版本；须与 assistant 钉的 @deepseek-ai/* 版本一致，2.x 目前钉 0.2.1-alpha.2）'
        required: false
        default: '0.2.1-alpha.2'
      dsh_assistant_version:
        description: '钉钉插件版本（dingtalk-dsh-assistant 的 pin 版本，须与 DSH 代际兼容）'
        required: false
        default: '2.1.0'

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  # ── backend 版 software:<os>-dingtalk-dsh ──────────────────────────────
  build-dingtalk-dsh-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
          - openeuler-24.03
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          provenance: false
          sbom: false
          context: .
          file: ./images/software/backend/dingtalk-dsh
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:${{ matrix.os_tag }}-dingtalk-dsh
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/software:${{ matrix.os_tag }}-dingtalk-dsh
          cache-to: type=inline
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
            NPM_REGISTRY=https://registry.npmmirror.com
            DSH_PIN_VERSION=${{ inputs.dsh_version }}
            DSH_ASSISTANT_PIN_VERSION=${{ inputs.dsh_assistant_version }}

  # ── desktop 版（python-extension-pack 矩阵：Python 3.12 / 3.14）─────────
  build-desktop-ext-dingtalk-dsh:
    runs-on: ubuntu-latest
    # python_series 矩阵条目：透传 PYTHON_SERIES build-arg 派生上游
    # deployment:<os>-desktop-python<series>-extension-pack 与产物 tag
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
          - openeuler-24.03
        python_series:
          - "3.12"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          provenance: false
          sbom: false
          context: .
          file: ./deployment/common/desktop/python-extension-pack/Dockerfile-dingtalk-dsh
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deployment:${{ matrix.os_tag }}-desktop-python${{ matrix.python_series }}-extension-pack-dingtalk-dsh
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deployment:${{ matrix.os_tag }}-desktop-python${{ matrix.python_series }}-extension-pack-dingtalk-dsh
          cache-to: type=inline
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
            PYTHON_SERIES=${{ matrix.python_series }}
            NPM_REGISTRY=https://registry.npmmirror.com
            DSH_PIN_VERSION=${{ inputs.dsh_version }}
            DSH_ASSISTANT_PIN_VERSION=${{ inputs.dsh_assistant_version }}
