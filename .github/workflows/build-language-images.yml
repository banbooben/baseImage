name: 构建语言层镜像（Python / OpenJDK）

# 语言类镜像（language:<os>-python-*）独立入口，仅手动触发。
# 语言层统一用官方源码包（python.org tarball）构建的 CPython；
# miniconda3 已移除。
#
# 前置条件：base:<os> 已存在（build-base-images.yml 产出）。
# 产物：language:<os>-python-<series>[-ft]、language:<os>-openjdk-<major>
#
# 中间件（middleware:<os>-redis-*）另见 build-middleware-images.yml。

on:
  # 手动入口：语言层不在 build-all 自动链，需要时 dispatch 本文件。
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  NAMESPACE: ${{ secrets.NAMESPACE }}

jobs:
  build-python:
    runs-on: ubuntu-latest
    # 只产出 Ubuntu(noble)；openEuler 镜像已停用（2026-11）
    # os_tag 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签。
    # python 矩阵条目：series=版本系列, suffix=tag 后缀（-ft 为 free-threaded），
    # disable_gil 透传 --disable-gil，fallback 为版本解析失败时的兜底，
    # prerelease=true 时正式版发布前走 ftp 目录解析预发布包
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
        python:
          - { series: "3.15", suffix: "", fallback: "3.15.0rc2", prerelease: true }
          - { series: "3.15", suffix: "-ft", disable_gil: true, fallback: "3.15.0rc2", prerelease: true }
          - { series: "3.14", suffix: "", fallback: "3.14.0" }
          - { series: "3.14", suffix: "-ft", disable_gil: true, fallback: "3.14.0" }
          - { series: "3.13", suffix: "", fallback: "3.13.0" }
          - { series: "3.13", suffix: "-ft", disable_gil: true, fallback: "3.13.0" }
          - { series: "3.12", suffix: "", fallback: "3.12.0" }
          - { series: "3.11", suffix: "", fallback: "3.11.0" }
          - { series: "3.10", suffix: "", fallback: "3.10.0" }
    steps:
      - uses: actions/checkout@v7
      - name: Resolve latest Python version
        id: version
        run: |
          ARGS=(python "${{ matrix.python.series }}" "${{ matrix.python.fallback }}")
          [ "${{ matrix.python.prerelease || false }}" = "true" ] && ARGS+=(--prerelease)
          VERSION=$(ci/resolve_versions.sh "${ARGS[@]}")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          provenance: false
          sbom: false
          context: .
          file: ./images/languages/python/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/language:${{ matrix.os_tag }}-python-${{ matrix.python.series }}${{ matrix.python.suffix }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/language:${{ matrix.os_tag }}-python-${{ matrix.python.series }}${{ matrix.python.suffix }}
          cache-to: type=inline
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
            PYTHON_SERIES=${{ matrix.python.series }}
            PYTHON_DISABLE_GIL=${{ matrix.python.disable_gil || false }}
            PYTHON_PIN_VERSION=${{ steps.version.outputs.version }}

  build-openjdk:
    runs-on: ubuntu-latest
    # 只产出 Ubuntu(noble)；openEuler 镜像已停用（2026-11）
    # os_tag 既进产物 tag，也作为 build-arg 透传给 Dockerfile 派生上游层标签。
    # java 矩阵条目：major=主版本号，fallback 为版本解析失败时的兜底
    strategy:
      fail-fast: false
      matrix:
        os_tag:
          - noble
        java:
          - { major: "21", fallback: "21.0.0" }
          - { major: "24", fallback: "24.0.0" }
          - { major: "25", fallback: "25.0.0" }
    steps:
      - uses: actions/checkout@v7
      - name: Resolve latest OpenJDK version
        id: version
        run: |
          VERSION=$(ci/resolve_versions.sh java "${{ matrix.java.major }}" "${{ matrix.java.fallback }}")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALY_ARC_USERNAME }}
          password: ${{ secrets.ALY_ARC_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          provenance: false
          sbom: false
          context: .
          file: ./images/languages/java/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/language:${{ matrix.os_tag }}-openjdk-${{ matrix.java.major }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/language:${{ matrix.os_tag }}-openjdk-${{ matrix.java.major }}
          cache-to: type=inline
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            NAMESPACE=${{ env.NAMESPACE }}
            OS_TAG=${{ matrix.os_tag }}
            JDK_VERSION=${{ matrix.java.major }}
            JAVA_PIN_VERSION=${{ steps.version.outputs.version }}
